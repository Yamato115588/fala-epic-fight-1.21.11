name: Fabric 1.21.11 code build

on:
  push:
    branches:
      - fabric-1.21.11
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare pinned Fabric source
        run: python3 tools/prepare_fabric_port.py "$RUNNER_TEMP/epicfight-fabric-work"
      - name: Run Gradle Wrapper build
        id: full-build
        working-directory: ${{ runner.temp }}/epicfight-fabric-work
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --no-problems-report --console=plain --max-workers=2 --continue \
            -I "$GITHUB_WORKSPACE/tools/compiler-diagnostics.gradle" clean build 2>&1 | tee "$RUNNER_TEMP/epicfight-build.log"
      - name: Test compute output in Minecraft RenderPass
        if: ${{ !cancelled() && steps.full-build.outcome != 'skipped' }}
        working-directory: ${{ runner.temp }}/epicfight-fabric-work
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a ./gradlew --no-daemon --console=plain --max-workers=2 -I "$GITHUB_WORKSPACE/tools/renderpass-test/renderpass.gradle" testComputeRenderPass
      - name: Upload compiler diagnostics
        if: ${{ failure() && steps.full-build.outcome == 'failure' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: epicfight-compiler-diagnostics
          path: ${{ runner.temp }}/epicfight-build.log
          if-no-files-found: error
      - name: Validate remapped Fabric JAR
        id: fabric-jar
        run: |
          jar=$(python3 tools/check_fabric_jar.py "$RUNNER_TEMP/epicfight-fabric-work/build/libs")
          printf 'path=%s\n' "$jar" >> "$GITHUB_OUTPUT"
      - name: Upload successful code build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: epicfight-fabric-1.21.11-code-only
          path: ${{ steps.fabric-jar.outputs.path }}
          if-no-files-found: error
