name: Fabric 1.21.11 code build

on:
  push:
    branches:
      - fabric-1.21.11
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare pinned Fabric source
        run: python3 tools/prepare_fabric_port.py "$RUNNER_TEMP/epicfight-fabric-work"
      - name: Run Gradle Wrapper build
        working-directory: ${{ runner.temp }}/epicfight-fabric-work
        run: ./gradlew --no-daemon --no-problems-report --console=plain --max-workers=2 --continue clean build
      - name: Validate remapped Fabric JAR
        id: fabric-jar
        run: |
          jar=$(python3 tools/check_fabric_jar.py "$RUNNER_TEMP/epicfight-fabric-work/build/libs")
          printf 'path=%s\n' "$jar" >> "$GITHUB_OUTPUT"
      - name: Upload successful code build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: epicfight-fabric-1.21.11-code-only
          path: ${{ steps.fabric-jar.outputs.path }}
          if-no-files-found: error
