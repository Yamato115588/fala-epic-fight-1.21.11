name: Fabric 1.21.11 code build

on:
  push:
    branches:
      - fabric-1.21.11
  workflow_dispatch:
    inputs:
      boss_smoke:
        description: Run the Minecraft boss rendering smoke test
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare pinned Fabric source
        run: python3 tools/prepare_fabric_port.py "$RUNNER_TEMP/epicfight-fabric-work"
      - name: Run Gradle Wrapper build
        id: full-build
        working-directory: ${{ runner.temp }}/epicfight-fabric-work
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --no-problems-report --console=plain --max-workers=2 --continue \
            -I "$GITHUB_WORKSPACE/tools/compiler-diagnostics.gradle" clean build 2>&1 | tee "$RUNNER_TEMP/epicfight-build.log"
      - name: Test replacement assets and compile the boss lifecycle probe
        if: ${{ !cancelled() && steps.full-build.outcome != 'skipped' }}
        working-directory: ${{ runner.temp }}/epicfight-fabric-work
        run: |
          ./gradlew --no-daemon --console=plain --max-workers=2 \
            -I "$GITHUB_WORKSPACE/tools/data-test/data.gradle" testPortData \
            -I "$GITHUB_WORKSPACE/tools/boss-test/boss.gradle" remapBossProbeJar
      - name: Test compute output in Minecraft RenderPass
        if: ${{ !cancelled() && steps.full-build.outcome != 'skipped' }}
        working-directory: ${{ runner.temp }}/epicfight-fabric-work
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a ./gradlew --no-daemon --console=plain --max-workers=2 -I "$GITHUB_WORKSPACE/tools/renderpass-test/renderpass.gradle" testComputeRenderPass
      - name: Upload compiler diagnostics
        if: ${{ failure() && steps.full-build.outcome == 'failure' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: epicfight-compiler-diagnostics
          path: ${{ runner.temp }}/epicfight-build.log
          if-no-files-found: error
      - name: Validate remapped Fabric JAR
        id: fabric-jar
        run: |
          jar=$(python3 tools/check_fabric_jar.py "$RUNNER_TEMP/epicfight-fabric-work/build/libs")
          (cd "$(dirname "$jar")" && sha256sum -- "$(basename "$jar")") > "$jar.sha256"
          (cd "$(dirname "$jar")" && sha256sum -c -- "$(basename "$jar").sha256")
          cat "$jar.sha256"
          printf 'path=%s\n' "$jar" >> "$GITHUB_OUTPUT"
      - name: Upload validated Fabric build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: epicfight-fabric-1.21.11
          path: |
            ${{ steps.fabric-jar.outputs.path }}
            ${{ steps.fabric-jar.outputs.path }}.sha256
          if-no-files-found: error
      - name: Smoke-test boss rendering in Minecraft
        id: boss-smoke
        if: ${{ github.event_name == 'push' || inputs.boss_smoke }}
        timeout-minutes: 6
        working-directory: ${{ runner.temp }}/epicfight-fabric-work
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
          LP_NUM_THREADS: '2'
        run: bash "$GITHUB_WORKSPACE/tools/world-test/run_ci_smoke.sh" "$RUNNER_TEMP/epicfight-boss-smoke.log"
      - name: Upload boss smoke summary
        if: ${{ !cancelled() && steps.boss-smoke.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: epicfight-boss-smoke-log
          path: ${{ runner.temp }}/epicfight-boss-smoke.log
          if-no-files-found: error
